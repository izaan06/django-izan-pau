<div class="chat-container">
  <div class="chat-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">💬 Xat en Directe</h5>
    <span class="badge bg-primary" id="message-count">0</span>
  </div>

  <div id="chat-messages" class="chat-messages">
    Carregant missatges...
  </div>

  {% if user.is_authenticated and event.status == 'live' %}
  <form id="chat-form" class="chat-form">
    {% csrf_token %}
    {{ chat_form.message }}
    <button type="submit" class="btn btn-primary btn-sm">
      Enviar
    </button>
    <div id="chat-errors" class="text-danger mt-2"></div>
  </form>

  {% elif not user.is_authenticated %}
    <p class="text-muted p-3">Inicia sessió per participar</p>

  {% else %}
    <p class="text-muted p-3">
      El xat només està disponible durant l'esdeveniment
    </p>
  {% endif %}
</div>

<script>
  const eventId = "{{ event.id }}";
</script>
