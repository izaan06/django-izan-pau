<div class="card md-4 mb-4 h-100">
  <img src="{{ event.thumbnail_or_default }}" class="card-img-top" alt="{{ event.title }}" style="height:200px; object-fit:cover;">
  
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ event.title }}</h5>
    <p class="card-text">{{ event.get_category_display }} | {{ event.scheduled_date|date:"M. d, Y, P" }}</p>
    <p class="card-text"><small class="text-muted">{{ event.get_status_display }}</small></p>
    <div class="mt-auto">
      <a href="{{ event.get_absolute_url }}" class="btn btn-primary btn-block">Veure</a>
    </div>
  </div>
</div>
